name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Sintaxis (compileall)
        run: python -m compileall app -q

      - name: SAST (Bandit medium+)
        run: bandit -r app/ --severity-level=medium -q

      - name: SCA (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Tests (pytest)
        env:
          SECRET_KEY: ci-test-secret-key-minimum-32-characters
          DATABASE_URL: sqlite:///./test_ci.db
          ENVIRONMENT: development
        run: pytest -q

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
